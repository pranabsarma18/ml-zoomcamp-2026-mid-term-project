<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Student depression classification project flow</title>
  <desc id="desc">Dataset flows through preprocessing and a trained logistic regression model. A client sends JSON to the FastAPI service and receives a probability and class label.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53657a"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172b4d}.title{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px;fill:#425466}.box{stroke-width:2;rx:18}
    </style>
  </defs>
  <rect width="1200" height="350" fill="#f6f8fb" rx="20"/>
  <text x="600" y="44" text-anchor="middle" class="title">From dataset to prediction API</text>
  <g transform="translate(35 105)">
    <rect class="box" width="200" height="150" fill="#e8f1ff" stroke="#7aa7e8"/>
    <text x="100" y="42" text-anchor="middle" class="label">Student records</text>
    <text x="100" y="76" text-anchor="middle" class="small">CSV data</text>
    <text x="100" y="100" text-anchor="middle" class="small">EDA + train/test split</text>
    <text x="100" y="124" text-anchor="middle" class="small">Sensitive field excluded</text>
  </g>
  <path d="M240 180H285" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(300 105)">
    <rect class="box" width="210" height="150" fill="#e8f8f0" stroke="#67b889"/>
    <text x="105" y="42" text-anchor="middle" class="label">Preprocessing</text>
    <text x="105" y="76" text-anchor="middle" class="small">Impute missing values</text>
    <text x="105" y="100" text-anchor="middle" class="small">Scale numeric features</text>
    <text x="105" y="124" text-anchor="middle" class="small">Encode categories</text>
  </g>
  <path d="M515 180H560" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(575 105)">
    <rect class="box" width="210" height="150" fill="#fff3df" stroke="#e6ad55"/>
    <text x="105" y="42" text-anchor="middle" class="label">Classifier</text>
    <text x="105" y="76" text-anchor="middle" class="small">Logistic Regression</text>
    <text x="105" y="100" text-anchor="middle" class="small">Fitted pipeline</text>
    <text x="105" y="124" text-anchor="middle" class="small">Stored in model.bin</text>
  </g>
  <path d="M790 180H835" stroke="#53657a" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(850 105)">
    <rect class="box" width="310" height="150" fill="#f2eaff" stroke="#a78bdb"/>
    <text x="155" y="42" text-anchor="middle" class="label">FastAPI on Fly.io or Docker</text>
    <text x="155" y="76" text-anchor="middle" class="small">POST /predict with JSON features</text>
    <text x="155" y="100" text-anchor="middle" class="small">Probability from 0 to 1</text>
    <text x="155" y="124" text-anchor="middle" class="small">Class label at threshold 0.5</text>
  </g>
  <text x="600" y="310" text-anchor="middle" class="small">Educational demonstration; output is not a clinical diagnosis.</text>
</svg>
